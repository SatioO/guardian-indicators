name: sign-and-catalog

# On merge to main: build every new indicator version from indicators/ with
# the pinned toolchain, sign every unsigned package with the registry key,
# rebuild catalog.json, verify every signature, commit the results and purge
# the CDN copy of the catalog — and confirm the CDN serves it — so the app sees
# new versions right away.
# The human merge is the moderation gate; this Action is the integrity step.
on:
  push:
    branches: [main]
  # Re-run by hand (Actions → sign-and-catalog → Run workflow), e.g. to refresh
  # the CDN catalog. Idempotent: unchanged indicators rebuild to nothing new,
  # signed packages stay as they are.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sign-and-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Indicator tests
        run: npm test

      - name: Build new versions
        run: npx gscript-toolchain publish --write --report publish-report.md

      - name: Sign unsigned packages
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: node scripts/sign.mjs

      - name: Rebuild catalog
        run: node scripts/build-catalog.mjs

      - name: Verify every signature
        run: node scripts/verify.mjs

      - name: Commit packages, signatures + catalog
        run: |
          git config user.name "guardian-registry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages catalog.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: publish packages, sign, rebuild catalog [skip ci]"
            git push
          fi

      # Purge, then confirm jsDelivr serves the catalog just committed; a single
      # purge right after the push can race the CDN re-caching the old commit.
      - name: Refresh the CDN catalog (verified)
        run: node scripts/refresh-cdn.mjs

      - name: Publish report
        if: always()
        run: |
          if [ -f publish-report.md ]; then
            { echo "## Published"; echo; cat publish-report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
